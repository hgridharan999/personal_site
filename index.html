    <meta name="theme-color" content="#0B0A0A" />
    <!-- Pre-paint, homepage only: style the document white and start the mountain
         download before React mounts, so "/" never flashes the dark site. Other
         routes keep the dark theme-color above. useHomeDocument() does the same
         on client-side navigation. -->
    <script>
      (function () {
        if (location.pathname !== '/') return;
        document.documentElement.classList.add('hm-page');
        document.querySelector('meta[name="theme-color"]').setAttribute('content', '#FFFFFF');
        var preload = document.createElement('link');
        preload.rel = 'preload';
        preload.as = 'image';
        preload.href = '/mountain-plate.webp';
        preload.type = 'image/webp';
        preload.setAttribute('fetchpriority', 'high');
        document.head.appendChild(preload);
        // the homepage's fonts, so the first paint is already in Geist (no re-wrap)
        ['/fonts/geist-latin.woff2', '/fonts/instrument-serif-italic-latin.woff2'].forEach(function (href) {
          var font = document.createElement('link');
          font.rel = 'preload';
          font.as = 'font';
          font.type = 'font/woff2';
          font.href = href;
          font.crossOrigin = 'anonymous';
          document.head.appendChild(font);
        });
      })();
    </script>
