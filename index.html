    <meta name="theme-color" content="#0B0A0A" />
    <!-- Pre-paint, light routes only ("/" and the pages it links to): style the
         document white and preload the fonts before React mounts, so a hard load
         never flashes the dark site. The mountain download starts on "/" alone.
         Other routes (/login, /me) keep the dark theme-color above. The route list
         repeats src/site/lightRoutes.js, and lightRoutes.test.js keeps the two in
         step. useHomeDocument() does the same on client-side navigation. -->
    <script>
      (function () {
        var home = location.pathname === '/';
        var light = home || /^\/(hiking|writing|climate-search|privacy|terms|legal|blog\/[^/]+)\/?$/i.test(location.pathname);
        if (!light) return;
        document.documentElement.classList.add('hm-page');
        document.querySelector('meta[name="theme-color"]').setAttribute('content', '#FFFFFF');
        function preload(href, as, type, extra) {
          var link = document.createElement('link');
          link.rel = 'preload';
          link.as = as;
          link.type = type;
          link.href = href;
          if (extra) extra(link);
          document.head.appendChild(link);
        }
        if (home) {
          preload('/mountain-plate.webp', 'image', 'image/webp', function (link) {
            link.setAttribute('fetchpriority', 'high');
          });
        }
        // the light pages' fonts, so the first paint is already in Geist (no re-wrap)
        ['/fonts/geist-latin.woff2', '/fonts/instrument-serif-italic-latin.woff2'].forEach(function (href) {
          preload(href, 'font', 'font/woff2', function (link) {
            link.crossOrigin = 'anonymous';
          });
        });
      })();
    </script>
