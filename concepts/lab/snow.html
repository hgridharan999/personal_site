<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lab: snow on the footer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Hanken+Grotesk:wght@800&family=Instrument+Serif:ital@1&display=swap">
<style>
  :root {
    --bg: #FFFFFF;
    --ink: #111111;
    --muted: #5C5C5C;
    --tan: #0F7DAA;
    --rule: rgba(0, 0, 0, 0.10);
    --mono: "DM Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --gutter: 16px;
    /* 240px on a 390 phone, 340px from ~900px up */
    --band-h: clamp(240px, calc(240px + (100vw - 390px) * 0.196), 340px);
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { background: var(--bg); color-scheme: light; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 400 16px/1.6 var(--mono); -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  .lab { min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; }  /* the caption's auto margin pushes the band to the foot of the viewport without ever clipping it */
  .cap {
    margin: auto 0 0; padding: 0 var(--gutter) 6px; width: 100%; max-width: calc(1100px + var(--gutter) * 2); margin-inline: auto;
    font: 400 12px/1.4 var(--mono); letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted);
  }
  .band { position: relative; width: 100%; height: var(--band-h); }
  .stage { position: relative; width: 100%; max-width: 1100px; height: 100%; margin-inline: auto; touch-action: pan-y; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #fx { -webkit-mask-image: linear-gradient(to bottom, transparent, #000 56px); mask-image: linear-gradient(to bottom, transparent, #000 56px); }
  @media (min-width: 1180px) {
    /* soft edges where the capped drawing area ends, so snow never ends in a hard vertical cut */
    .stage { -webkit-mask-image: linear-gradient(to right, transparent, #000 40px, #000 calc(100% - 40px), transparent); mask-image: linear-gradient(to right, transparent, #000 40px, #000 calc(100% - 40px), transparent); }
  }
  .foot { border-top: 1px solid var(--rule); }
  .foot p {
    margin: 0; width: 100%; max-width: calc(1100px + var(--gutter) * 2); margin-inline: auto; padding: 14px var(--gutter) 18px;
    font: 400 12px/1.4 var(--mono); letter-spacing: 0.02em; text-transform: uppercase; color: var(--muted); text-wrap: balance;
  }
</style>
</head>
<body>
<main class="lab">
  <p class="cap">Lab / snow on the footer</p>
  <section class="band" id="band" aria-hidden="true">
    <div class="stage" id="stage">
      <canvas id="type"></canvas>
      <canvas id="fx"></canvas>
    </div>
  </section>
  <footer class="foot"><p>CONTOUR INTERVAL 1 YEAR · LAST UPDATED OCT 2026</p></footer>
</main>

<script>
(() => {
  'use strict';

  /* ------------------------------------------------------------------------------------------
     Snow on the footer.
     - The name is set once on a static canvas and rasterised into an offscreen mask; the topmost
       inked pixel of every 1px column is that column's "surface".
     - Settled snow is only a per-column heightfield (Float32Array) lying on those surfaces. It
       relaxes toward an angle of repose, saturates, and spills over glyph edges as flakes.
     - Airborne flakes are a small fixed pool (capped). They land into the heightfield and respawn.
     - The pointer brushes snow off the heightfield and turns it back into tumbling flakes.
     ------------------------------------------------------------------------------------------ */

  const INK = '#111111', BLUE = '#0F7DAA';
  const SANS = '"Hanken Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
  const SERIF = '"Instrument Serif", "Times New Roman", serif';

  const band = document.getElementById('band');
  const stage = document.getElementById('stage');
  const typeCv = document.getElementById('type'), tctx = typeCv.getContext('2d');
  const fxCv = document.getElementById('fx'), ctx = fxCv.getContext('2d');
  const reduceMQ = matchMedia('(prefers-reduced-motion: reduce)');
  let reduced = reduceMQ.matches;

  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const rnd = (a, b) => a + Math.random() * (b - a);
  const gauss = () => (Math.random() + Math.random() + Math.random() - 1.5) * 1.15;

  /* ---- tunables ---------------------------------------------------------------------------- */
  const CLIFF = 5;       // surface step (px) between neighbouring columns that snow cannot cross
  const REPOSE = 0.75;   // max altitude step per column before snow slides
  const EDGE_H = 4.5;    // snow depth allowed on the lip of a glyph before it spills
  const SNOW_FILL = '#EDF1F5', SNOW_EDGE = 'rgba(17, 17, 17, 0.34)';

  /* ---- state ------------------------------------------------------------------------------- */
  let W = 0, H = 0, dpr = 1, ready = false;
  let S, hgt, taper, lip;          // per-column: surface y, snow depth, edge taper, glyph-lip flag
  let hMax = 12;                   // saturation depth
  let spillCarry = 0, trickle = 0;
  let simT = 0;

  // flake pool (structure of arrays)
  // ids [0, P) are ambient flakes that always respawn; [P, P + T) are tumblers shaken loose by the brush or spilled off glyphs
let P = 0, T = 0, fx, fy, fvx, fvy, fr, fcls, ffall, fph, fsw, fwf, fboost, fact;

  /* ---- sprites: soft ink-gray dots in a few sizes, and a rare iceberg blue ----------------- */
  const SIZES = [0.9, 1.3, 1.8, 2.5];
  const SIZE_P = [0.38, 0.70, 0.90, 1.0];
  const ALPHAS = [0.40, 0.46, 0.52, 0.58];
  let sprites = [];                // index 0..3 ink, 4 blue
  function makeSprite(r, rgb, alpha) {
    const pad = 1.6, cssSize = (r + pad) * 2, px = Math.ceil(cssSize * dpr);
    const c = document.createElement('canvas'); c.width = c.height = px;
    const g = c.getContext('2d');
    const m = px / 2, rad = r * dpr, edge = (r + pad) * dpr;
    const grad = g.createRadialGradient(m, m, 0, m, m, edge);
    const a = (k) => `rgba(${rgb}, ${(alpha * k).toFixed(3)})`;
    const core = rad / edge;
    grad.addColorStop(0, a(1)); grad.addColorStop(core * 0.7, a(0.92)); grad.addColorStop(core, a(0.5)); grad.addColorStop(1, a(0));
    g.fillStyle = grad; g.fillRect(0, 0, px, px);
    return { c, half: px / (2 * dpr) };
  }
  function buildSprites() {
    sprites = SIZES.map((r, i) => makeSprite(r, '17, 17, 17', ALPHAS[i]));
    sprites.push(makeSprite(2.1, '15, 125, 170', 0.9));
  }

  /* ---- type: fit, draw, mask ----------------------------------------------------------------- */
  function layoutType() {
    const probe = document.createElement('canvas').getContext('2d');
    const ls = (px) => { if ('letterSpacing' in probe) probe.letterSpacing = px + 'px'; };
    probe.font = `800 100px ${SANS}`; ls(-3);
    const wSur = probe.measureText('GRIDHARAN').width;
    const m = probe.measureText('H');
    const cap = m.actualBoundingBoxAscent / 100 || 0.7;
    probe.font = `italic 400 120px ${SERIF}`; ls(0);
    const wHari = probe.measureText('Hari').width;
    const hm = probe.measureText('H');
    const hariCap = hm.actualBoundingBoxAscent / 120 || 0.7;
    const space = 0.26;
    const oneLine = (wSur + wHari) / 100 + space;          // widths in em of the sans size
    const target = W * (W > 700 ? 0.84 : 0.9);
    let fs = target / oneLine, stacked = false;
    if (fs < 58) { stacked = true; fs = (W - 32) / (wSur / 100); fs = Math.min(fs, (H - 28) / 1.8); }
    return { fs, stacked, cap, hariCap, wSur: wSur / 100, wHari: wHari / 100, space };
  }

  function paintType(g, L, color) {
    const fs = L.fs, base = H - 0.5;
    const lsSet = (v) => { if ('letterSpacing' in g) g.letterSpacing = v + 'px'; };
    g.textBaseline = 'alphabetic';
    let xSur, xHari, yHari = base;
    if (L.stacked) {
      xSur = 16; xHari = 14;
      yHari = base - L.cap * fs - fs * 0.2;
    } else {
      const total = (L.wSur + L.wHari * 1.2 + L.space) * fs;
      xHari = (W - total) / 2; xSur = xHari + (L.wHari * 1.2 + L.space) * fs;
    }
    g.font = `italic 400 ${fs * 1.2}px ${SERIF}`; lsSet(0);
    g.fillStyle = color || BLUE; g.fillText('Hari', xHari, yHari);
    g.font = `800 ${fs}px ${SANS}`; lsSet(-0.03 * fs);
    g.fillStyle = color || INK; g.fillText('GRIDHARAN', xSur, base);
  }

  /* ---- build ------------------------------------------------------------------------------- */
  function build() {
    const rect = stage.getBoundingClientRect();
    W = Math.round(rect.width); H = Math.round(rect.height);
    dpr = Math.min(2, window.devicePixelRatio || 1);
    for (const c of [typeCv, fxCv]) { c.width = Math.round(W * dpr); c.height = Math.round(H * dpr); }

    const L = layoutType();
    tctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    tctx.clearRect(0, 0, W, H);
    paintType(tctx, L);

    // 1x mask of the same layout -> topmost inked pixel per column
    const mk = document.createElement('canvas'); mk.width = W; mk.height = H;
    const mg = mk.getContext('2d', { willReadFrequently: true });
    paintType(mg, L, '#000');
    const data = mg.getImageData(0, 0, W, H).data;
    S = new Float32Array(W); hgt = new Float32Array(W); taper = new Float32Array(W); lip = new Uint8Array(W);
    for (let x = 0; x < W; x++) {
      let top = H;
      for (let y = 0; y < H; y++) if (data[(y * W + x) * 4 + 3] > 110) { top = y; break; }
      S[x] = top;
    }
    const edgeW = W > 700 ? 90 : 40;
    for (let x = 0; x < W; x++) {
      const e = Math.min(x, W - 1 - x) / edgeW, t = clamp(e, 0, 1);
      taper[x] = t * t * (3 - 2 * t);
      const l = x > 0 && S[x - 1] - S[x] > CLIFF, r = x < W - 1 && S[x + 1] - S[x] > CLIFF;
      lip[x] = l || r ? 1 : 0;
    }
    hMax = clamp(L.fs * 0.19, 10, 22);

    P = clamp(Math.round(W * H * 0.00105), 90, 480);
    T = clamp(Math.round(P * 0.38), 60, 160);
    const n = P + T;
    fx = new Float32Array(n); fy = new Float32Array(n); fvx = new Float32Array(n); fvy = new Float32Array(n);
    fr = new Float32Array(n); fcls = new Uint8Array(n); ffall = new Float32Array(n); fph = new Float32Array(n);
    fsw = new Float32Array(n); fwf = new Float32Array(n); fboost = new Float32Array(n); fact = new Uint8Array(n);
    cursor = 0;
    buildSprites();
    for (let i = 0; i < P; i++) { respawn(i, true); fact[i] = 1; }
    simT = 0;

    if (reduced) { for (let k = 0; k < 6.5 * 60; k++) tick(1 / 60, true); }
    draw();
  }

  /* ---- flakes ------------------------------------------------------------------------------- */
  function respawn(i, anywhere) {
    const u = Math.random();
    let c = 0; while (c < 3 && u > SIZE_P[c]) c++;
    fcls[i] = Math.random() < 0.02 ? 4 : c;
    const r = fcls[i] === 4 ? 2.1 : SIZES[c];
    fr[i] = r;
    ffall[i] = 22 + r * 13 + rnd(0, 9);
    fx[i] = rnd(0, W);
    fy[i] = anywhere ? rnd(-4, H * 0.96) : rnd(-60, -3);
    fvx[i] = 0; fvy[i] = ffall[i];
    fph[i] = rnd(0, 6.283); fsw[i] = rnd(4, 11); fwf[i] = rnd(0.7, 1.3); fboost[i] = 0;
  }

  const wind = (t) => 15 * Math.sin(t * 0.31) + 8 * Math.sin(t * 0.83 + 1.7) + 4;

  function deposit(cx, amt) {
    const c = Math.floor(cx);
    if (c < 0 || c >= W) return;
    const K = 5, base = S[c];
    let ws = 0;
    for (let j = Math.max(0, c - K); j <= Math.min(W - 1, c + K); j++) if (Math.abs(S[j] - base) < 7) ws += K + 1 - Math.abs(j - c);
    if (ws === 0) return;
    for (let j = Math.max(0, c - K); j <= Math.min(W - 1, c + K); j++) {
      if (Math.abs(S[j] - base) >= 7) continue;
      const sat = Math.max(0, 1 - hgt[j] / hMax);
      hgt[j] += amt * (K + 1 - Math.abs(j - c)) / ws * sat * taper[j];
    }
  }

  function relax() {
    for (let pass = 0; pass < 2; pass++) {
      const fwd = pass === 0;
      for (let k = 0; k < W - 1; k++) {
        const x = fwd ? k : W - 2 - k;
        if (Math.abs(S[x] - S[x + 1]) > CLIFF) continue;
        const d = (S[x + 1] - hgt[x + 1]) - (S[x] - hgt[x]);   // > 0: x sits higher than x+1
        // snow slides downhill, but a full pocket stops taking more (no pillars in narrow gaps)
        if (d > REPOSE) { const m = Math.min(hgt[x], (d - REPOSE) * 0.5, Math.max(0, hMax * 1.15 - hgt[x + 1])); hgt[x] -= m; hgt[x + 1] += m; }
        else if (d < -REPOSE) { const m = Math.min(hgt[x + 1], (-d - REPOSE) * 0.5, Math.max(0, hMax * 1.15 - hgt[x])); hgt[x + 1] -= m; hgt[x] += m; }
      }
    }
    // snow settles into rounded dollops, not tents: diffuse depth between neighbours on the same surface
    for (let pass = 0; pass < 2; pass++) {
      let prev = hgt[0];
      for (let x = 1; x < W - 1; x++) {
        const cur = hgt[x];
        if (Math.abs(S[x - 1] - S[x]) <= 2 && Math.abs(S[x + 1] - S[x]) <= 2) hgt[x] = cur + (prev + hgt[x + 1] - 2 * cur) * 0.2;
        prev = cur;
      }
    }
    // glyph lips can't hold a pile: the excess slides off as a few flakes
    let spilled = 0;
    for (let x = 0; x < W; x++) {
      if (!lip[x] || hgt[x] <= EDGE_H) continue;
      spillCarry += hgt[x] - EDGE_H; hgt[x] = EDGE_H;
      if (spillCarry > 18 && spilled < 2) {
        spillCarry -= 18; spilled++;
        const dir = x > 0 && S[x - 1] - S[x] > CLIFF ? -1 : 1;
        spawnTumble(x + dir * 1.5, S[x] - EDGE_H, dir * rnd(10, 40), rnd(-5, 15), rnd(0.9, 1.4), 0.5);
      }
    }
  }

  let cursor = 0;
  function spawnTumble(x, y, vx, vy, r, boost) {
    let i = -1;
    for (let k = 0; k < T; k++) { const j = P + (cursor = (cursor + 1) % T); if (!fact[j]) { i = j; break; } }
    if (i < 0) return;                                  // pool is capped: drop the rest
    fact[i] = 1;
    fx[i] = x; fy[i] = y; fvx[i] = vx; fvy[i] = vy; fr[i] = r; fboost[i] = boost;
    fcls[i] = r < 1.1 ? 0 : r < 1.55 ? 1 : r < 2.1 ? 2 : 3;
    ffall[i] = 22 + r * 13 + rnd(0, 9); fph[i] = rnd(0, 6.283); fsw[i] = rnd(4, 11); fwf[i] = rnd(0.7, 1.3);
  }

  /* ---- one simulation step -------------------------------------------------------------------- */
  function tick(dt, quiet) {
    simT += dt;
    const wnd = wind(simT);
    for (let i = 0; i < P + T; i++) {
      if (!fact[i]) continue;
      let b = fboost[i];
      if (b > 0) { b -= dt * 0.75; fboost[i] = b > 0 ? b : 0; if (b < 0) b = 0; }
      const vt = ffall[i] * (1 + 2 * b);
      fvy[i] += (vt - fvy[i]) * Math.min(1, dt * (b > 0 ? 1.8 : 3));
      const wx = wnd * fwf[i] + Math.sin(simT * 1.3 + fph[i]) * fsw[i];
      fvx[i] += (wx - fvx[i]) * Math.min(1, dt * (b > 0 ? 1.2 : 2.5));

      let nx = fx[i] + fvx[i] * dt, ny = fy[i] + fvy[i] * dt;
      if (nx < -6) nx += W + 12; else if (nx > W + 6) nx -= W + 12;
      let col = clamp(nx | 0, 0, W - 1);
      const oc = clamp(fx[i] | 0, 0, W - 1);
      // blocked sideways by a glyph or a pile: slide along it instead of passing through
      if (fy[i] < S[oc] - hgt[oc] && fy[i] >= S[col] - hgt[col] && Math.abs(nx - fx[i]) < 30) {
        nx = fx[i]; fvx[i] *= -0.15; col = oc;
      }
      if (ny >= S[col] - hgt[col]) {
        deposit(nx, fboost[i] > 0 || fr[i] > 2 ? 6 : 3.4);
        if (i < P) respawn(i, false); else fact[i] = 0;
        continue;
      }
      fx[i] = nx; fy[i] = ny;
      if (ny > H + 6) { if (i < P) respawn(i, false); else fact[i] = 0; }
    }
    // unseen finer snow: keeps the drifts smooth, and the real flakes keep the pace honest
    trickle += W * dt * 0.87;
    const n = Math.floor(trickle); trickle -= n;
    for (let k = 0; k < n; k++) deposit(Math.random() * W, 1.9);
    relax();
  }

  /* ---- drawing -------------------------------------------------------------------------------- */
  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);

    // settled snow: one polygon per run of connected columns
    ctx.fillStyle = SNOW_FILL; ctx.strokeStyle = SNOW_EDGE; ctx.lineWidth = 1; ctx.lineJoin = 'round';
    let x = 0;
    while (x < W) {
      if (hgt[x] < 0.25) { x++; continue; }
      let e = x;
      while (e + 1 < W && hgt[e + 1] >= 0.25 && Math.abs(S[e + 1] - S[e]) <= CLIFF) e++;
      ctx.beginPath();
      ctx.moveTo(x, S[x] + 0.8);
      for (let c = x; c <= e; c++) ctx.lineTo(c + 0.5, S[c] - hgt[c]);
      ctx.lineTo(e + 1, S[e] - hgt[e] + 0.4);
      ctx.lineTo(e + 1, S[e] + 0.8);
      for (let c = e; c >= x; c--) ctx.lineTo(c + 0.5, S[c] + 0.8);
      ctx.closePath(); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(x, S[x] - hgt[x] + 0.4);
      for (let c = x; c <= e; c++) ctx.lineTo(c + 0.5, S[c] - hgt[c]);
      ctx.lineTo(e + 1, S[e] - hgt[e] + 0.4);
      ctx.stroke();
      x = e + 1;
    }

    for (let i = 0; i < P + T; i++) {
      if (!fact[i]) continue;
      const sp = sprites[fcls[i]];
      ctx.drawImage(sp.c, fx[i] - sp.half, fy[i] - sp.half, sp.half * 2, sp.half * 2);
    }
  }

  /* ---- pointer: brush the snow off ------------------------------------------------------------ */
  const ptr = { x: 0, y: 0, vx: 0, vy: 0, t: 0, on: false, down: false };
  let brushCarry = 0;

  function brushAt(px, py, rad, strength, vx, vy) {
    const x0 = Math.max(0, Math.floor(px - rad)), x1 = Math.min(W - 1, Math.ceil(px + rad));
    let spawned = 0;
    for (let c = x0; c <= x1; c++) {
      const hh = hgt[c];
      if (hh < 0.2) continue;
      const top = S[c] - hh, dx = c - px;
      const yc = clamp(py, top, S[c]), dy = py - yc;
      const d = Math.sqrt(dx * dx + dy * dy);
      if (d >= rad) continue;
      const f = 1 - d / rad;
      const rem = hh * Math.min(0.97, f * 1.5 * strength + 0.18 * strength);
      hgt[c] -= rem; brushCarry += rem;
      while (brushCarry > 13 && spawned < 36) {
        brushCarry -= 13; spawned++;
        spawnTumble(c + rnd(-1.5, 1.5), top + rnd(0, Math.max(1, rem)) - rnd(0, 3),
          clamp(vx * 0.22, -240, 240) + gauss() * 45, clamp(vy * 0.12, -120, 120) - rnd(10, 70) + gauss() * 20,
          rnd(0.9, 2.1), 1);
      }
    }
    if (brushCarry > 60) brushCarry = 0;
  }

  function brushSegment(ax, ay, bx, by, vx, vy, strength) {
    const rad = clamp(H * 0.16, 34, 54);
    const dist = Math.hypot(bx - ax, by - ay), steps = Math.max(1, Math.ceil(dist / (rad * 0.4)));
    for (let k = 1; k <= steps; k++) {
      const t = k / steps;
      brushAt(ax + (bx - ax) * t, ay + (by - ay) * t, rad, strength / Math.sqrt(steps), vx, vy);
    }
  }

  function localPoint(e) {
    const r = stage.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }
  stage.addEventListener('pointermove', (e) => {
    if (reduced || !ready) return;
    if (e.pointerType !== 'mouse' && !ptr.down) return;
    const p = localPoint(e), now = performance.now();
    if (ptr.on) {
      const dt = Math.max(8, now - ptr.t) / 1000;
      ptr.vx = ptr.vx * 0.5 + ((p.x - ptr.x) / dt) * 0.5; ptr.vy = ptr.vy * 0.5 + ((p.y - ptr.y) / dt) * 0.5;
      brushSegment(ptr.x, ptr.y, p.x, p.y, ptr.vx, ptr.vy, 1);
    }
    ptr.x = p.x; ptr.y = p.y; ptr.t = now; ptr.on = true;
  });
  stage.addEventListener('pointerdown', (e) => {
    if (reduced || !ready) return;
    const p = localPoint(e);
    ptr.down = true; ptr.on = true; ptr.x = p.x; ptr.y = p.y; ptr.t = performance.now(); ptr.vx = ptr.vy = 0;
    brushSegment(p.x, p.y, p.x, p.y, 0, 0, 1.6);   // a tap knocks a patch loose
  });
  const up = () => { ptr.down = false; };
  stage.addEventListener('pointerup', (e) => { up(); if (e.pointerType !== 'mouse') ptr.on = false; });
  stage.addEventListener('pointercancel', () => { up(); ptr.on = false; });
  stage.addEventListener('pointerleave', () => { ptr.on = false; });

  /* ---- loop: sleeps when offscreen or hidden ---------------------------------------------------- */
  let visible = false, running = false, last = 0;
  const canRun = () => ready && visible && !document.hidden && !reduced;

  function frame(now) {
    if (!canRun()) { running = false; return; }
    const dt = Math.min(1 / 20, Math.max(0.001, (now - last) / 1000)); last = now;
    tick(dt); draw();
    requestAnimationFrame(frame);
  }
  function wake() { if (running || !canRun()) return; running = true; last = performance.now(); requestAnimationFrame(frame); }

  new IntersectionObserver((entries) => {
    visible = entries[entries.length - 1].isIntersecting;
    wake();
  }, { threshold: 0 }).observe(band);
  document.addEventListener('visibilitychange', wake);

  reduceMQ.addEventListener('change', (e) => { reduced = e.matches; if (ready) { build(); wake(); } });

  /* ---- boot --------------------------------------------------------------------------------- */
  let rt = 0, lastKey = '';
  function relayout() {
    const r = stage.getBoundingClientRect();
    const key = Math.round(r.width) + 'x' + Math.round(r.height) + '@' + Math.min(2, window.devicePixelRatio || 1);
    if (key === lastKey) return;
    lastKey = key; build(); wake();
  }
  const withTimeout = (p, ms) => Promise.race([p, new Promise((res) => setTimeout(res, ms))]);
  const fontsReady = Promise.all([
    document.fonts.load(`800 100px "Hanken Grotesk"`, 'HARI GRIDHARAN'),
    document.fonts.load(`italic 400 100px "Instrument Serif"`, 'Hari'),
  ]).catch(() => {});

  withTimeout(fontsReady, 2500).then(() => {
    ready = true;
    relayout();
    new ResizeObserver(() => { clearTimeout(rt); rt = setTimeout(relayout, 90); }).observe(stage);
  });

  // debug hook for screenshots and tests: advance the simulation by `sec` without real time
  window.__sketch = {
    advance(sec) { for (let t = 0; t < sec; t += 1 / 60) tick(1 / 60); draw(); },
    brush(ax, ay, bx, by, vx, vy) { brushSegment(ax, ay, bx, by, vx, vy, 1); },
    info() {
      let tot = 0, mx = 0; for (let i = 0; i < W; i++) { tot += hgt[i]; mx = Math.max(mx, hgt[i]); }
      return { W, H, dpr, P, T, tum: Array.from(fact.subarray(P)).filter(Boolean).length, simT, snowArea: Math.round(tot), maxDepth: +mx.toFixed(1), hMax };
    },
  };
})();
</script>
