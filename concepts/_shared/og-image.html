<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>og:image 1200 × 630</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans:wght@500;700&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<style>
  /* Rendered to og-image.png with headless Chrome at exactly 1200 × 630. */
  html, body { margin: 0; background: #0B0A0A; }
  .card {
    position: relative; width: 1200px; height: 630px; overflow: hidden; box-sizing: border-box;
    padding: 72px 88px; display: grid; grid-template-columns: 236px 1fr; column-gap: 64px; align-items: center;
    color: #EDE7DA; font-family: 'IBM Plex Sans', sans-serif;
  }
  .contours { position: absolute; inset: 0; opacity: 0.09; }
  .hiker { position: relative; width: 236px; height: auto; display: block; }
  .text { position: relative; }
  .hari { display: block; font: italic 400 88px/0.9 'Instrument Serif', serif; color: #E8C089; }
  .last { display: block; font-weight: 700; font-size: 104px; line-height: 0.95; letter-spacing: -0.03em; text-transform: uppercase; }
  .seek { margin: 36px 0 0; font-weight: 500; font-size: 30px; line-height: 1.35; color: #E8C089; }
  .meta { margin: 22px 0 0; font: 400 19px/1 'IBM Plex Mono', monospace; letter-spacing: 0.14em; text-transform: uppercase; color: #A39E94; display: flex; flex-direction: column; gap: 12px; }
  .meta span:last-child { color: #EDE7DA; }
</style>
</head>
<body>
<div class="card">
  <svg class="contours" viewBox="0 0 1200 630" aria-hidden="true" fill="none" stroke="#EDE7DA" stroke-width="1.4">
    <path d="M-20 520 C 160 470, 300 560, 480 505 S 820 450, 1000 520 S 1180 560, 1240 530"/>
    <path d="M-20 548 C 170 500, 310 585, 490 532 S 830 478, 1010 548 S 1190 585, 1240 558"/>

    <path d="M-20 604 C 190 560, 330 636, 510 588 S 850 534, 1030 604 S 1210 636, 1240 614"/>
    <path d="M-20 60 C 220 110, 380 30, 600 80 S 960 140, 1240 70"/>
    <path d="M-20 32 C 230 82, 390 4, 610 52 S 970 112, 1240 42"/>
  </svg>
  <img class="hiker" src="hiker.png" alt="">
  <div class="text">
    <span class="hari">Hari</span>
    <span class="last">Gridharan</span>
    <p class="seek">Seeking Summer 2027 roles in strategy,<br>investing, BA &amp; PM — NYC / SF</p>
    <p class="meta"><span>Cornell Dyson ’29 · Dyson Scholar</span><span>harigridharan.com</span></p>
  </div>
</div>
</body>
</html>
